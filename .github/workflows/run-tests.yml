name: Run Salesforce Tests

# Manual trigger only. Pick what to run, say who gets the report.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Which tests to run"
        type: choice
        required: true
        default: "All tests"
        options:
          - "All tests"
          - "All UI tests"
          - "All API tests"
          - "tests/ui/test_create_account.py"
          - "tests/api/test_account_api.py"
          - "Custom (fill in custom_target below)"
      custom_target:
        description: "Custom path or -k filter. Only used when tests = Custom."
        required: false
        default: ""
      emails:
        description: "Email the report to (comma-separated)"
        required: true
        default: "ashish5social@gmail.com"
      workers:
        description: "Parallel workers"
        type: choice
        required: true
        default: "2"
        options: ["1", "2", "4"]

# Needed to push the published report to the gh-pages branch.
permissions:
  contents: write

concurrency:
  # One run at a time: parallel runs would race each other pushing gh-pages.
  group: sfauto-run
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # ── Salesforce (from repo secrets/variables) ──
      SF_LOGIN_URL: ${{ vars.SF_LOGIN_URL }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_JWT_USERNAME: ${{ secrets.SF_JWT_USERNAME }}
      SF_JWT_KEY_FILE: .certs/sfauto.key
      SFAUTO_PROFILE: ${{ vars.SFAUTO_PROFILE || 'default' }}
      # CI has no display; always headless regardless of the profile.
      BROWSER_HEADLESS: "true"
      # The live browser-in-browser stream has no viewer in CI.
      SCREENCAST_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore the JWT signing key
        # The key is a secret, so it exists only for the life of this job.
        run: |
          mkdir -p .certs
          printf '%s\n' "${{ secrets.SF_JWT_KEY }}" > .certs/sfauto.key
          chmod 600 .certs/sfauto.key
          # Fail loudly and early rather than 40 lines into a test run.
          openssl rsa -in .certs/sfauto.key -check -noout

      - name: Resolve test selection
        id: sel
        env:
          # Quoted through the environment rather than pasted into the
          # script body: custom_target is free text, and ${{ }} expansion
          # happens before bash ever sees the line.
          SEL: ${{ inputs.tests }}
          CUSTOM: ${{ inputs.custom_target }}
        run: |
          case "$SEL" in
            "All tests")     TARGET="tests/" ;;
            "All UI tests")  TARGET="tests/ui" ;;
            "All API tests") TARGET="tests/api" ;;
            "Custom (fill in custom_target below)")
              TARGET="$CUSTOM"
              if [ -z "$TARGET" ]; then
                echo "::error::tests=Custom but custom_target is empty."
                exit 1
              fi ;;
            *) TARGET="$SEL" ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Running: $TARGET"

      - name: Preflight (sfauto doctor)
        run: python -m src.cli doctor

      - name: Run tests
        id: run
        continue-on-error: true   # a failing suite must still be reported
        env:
          SFAUTO_SELECTION: ${{ inputs.tests }}
          TARGET: ${{ steps.sel.outputs.target }}
          WORKERS: ${{ inputs.workers }}
        run: |
          if [ -f "$TARGET" ] || [ -d "$TARGET" ]; then
            python -m pytest "$TARGET" -n "$WORKERS" -q
          else
            # Not a path — treat it as a -k expression.
            python -m pytest tests/ -k "$TARGET" -n "$WORKERS" -q
          fi

      - name: Build combined report
        id: report
        env:
          SFAUTO_SELECTION: ${{ inputs.tests }}
        run: python scripts/ci_report.py --reports-dir reports --out-dir ci_out --run-id "${{ github.run_id }}"

      - name: Publish report to gh-pages
        id: publish
        # Nothing to publish when the suite produced no reports at all
        # (e.g. collection failed). The email still goes out and says so.
        if: steps.report.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DIR: ${{ steps.report.outputs.run_dir }}
        run: |
          set -euo pipefail
          SITE=$(mktemp -d)
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # gh-pages may not exist yet; create it as an orphan the first time.
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" "$SITE"
          else
            git clone --depth 1 "$REMOTE" "$SITE"
            git -C "$SITE" checkout --orphan gh-pages
            git -C "$SITE" rm -rqf .
          fi

          mkdir -p "$SITE/runs/$RUN_DIR"
          cp ci_out/sfauto_report.html "$SITE/runs/$RUN_DIR/index.html"
          cp ci_out/run_meta.json      "$SITE/runs/$RUN_DIR/meta.json"

          python scripts/gh_pages_index.py "$SITE"

          git -C "$SITE" config user.name  "github-actions[bot]"
          git -C "$SITE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE" add -A
          git -C "$SITE" commit -m "Publish run $RUN_DIR" || echo "nothing to commit"
          git -C "$SITE" push origin gh-pages

          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/runs/${RUN_DIR}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Published: $URL"

      - name: Rebuild email body with the real published URL
        if: steps.publish.outputs.url != ''
        env:
          SFAUTO_SELECTION: ${{ inputs.tests }}
        run: |
          python scripts/ci_report.py --reports-dir reports --out-dir ci_out \
            --run-id "${{ github.run_id }}" \
            --public-url "${{ steps.publish.outputs.url }}"

      - name: Upload report as a workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfauto-report-${{ github.run_id }}
          path: ci_out/
          retention-days: 14

      - name: Email the report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: sfauto CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ inputs.emails }}
          subject: ${{ steps.report.outputs.subject }}
          html_body: file://ci_out/email_body.html
          # Skipped automatically when the report exceeds the mail size cap;
          # the published link in the body still has everything.
          attachments: ${{ steps.report.outputs.attach == 'true' && 'ci_out/sfauto_report.html' || '' }}
          convert_markdown: false

      - name: Job summary
        if: always()
        run: |
          {
            echo "## sfauto — ${{ steps.report.outputs.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Selection | ${{ inputs.tests }} |"
            echo "| Passed | ${{ steps.report.outputs.passed }} |"
            echo "| Failed | ${{ steps.report.outputs.failed }} |"
            echo "| Report | ${{ steps.publish.outputs.url }} |"
            echo "| Emailed to | ${{ inputs.emails }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if any test failed
        if: steps.report.outputs.status != 'passed'
        run: |
          echo "::error::${{ steps.report.outputs.failed }} test(s) failed."
          exit 1
