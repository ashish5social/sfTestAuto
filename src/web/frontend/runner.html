        imgRef.current.src = `data:image/jpeg;base64,${ev.data}`;
        setFrameCount((c) => c + 1);
      }
    };
    ws.onclose = () => setConnected(false);
    ws.onerror = () => setConnected(false);

    return () => {
      try { ws.close(); } catch (e) { /* noop */ }
    };
  }, [runId]);

  return (
    <>
      <div className="screencast-bar">
        <div className="bar-left">
          <span style={{whiteSpace:'nowrap'}}>
            <span className={`live-dot ${connected ? '' : 'off'}`} />
            {connected ? 'LIVE' : 'connecting...'} · {frameCount} frame{frameCount === 1 ? '' : 's'}
          </span>
          {testName && <span className="test-name-chip">{testName}</span>}
        </div>
        <button className="bar-close-btn" onClick={onClose} title="Stop watching and return to dashboard">
          Close
        </button>
      </div>
      <div className="screencast-frame">
        {frameCount === 0 ? (
          <div className="screencast-placeholder">
            <div className="spinner-inline" />
            <div>Waiting for the first frame…</div>
            <div style={{fontSize:'0.75rem', marginTop:'0.5rem', opacity:0.7}}>
              Chrome is starting up on the server. Frames will appear as soon as
              the test navigates to the first page.
            </div>
          </div>
        ) : null}
        <img ref={imgRef} alt="Live test stream" style={frameCount === 0 ? {display:'none'} : {}} />
      </div>
    </>
  );
}


// ─── Post-run video playback ───
// After the run finishes, the right pane stays mounted and swaps from
// the live <img> stream to a <video> player loading the recorded .webm
// from /screenshots/Test_UI_{ts}/recording_{ts}.webm. The timestamp
// is parsed from the report URL ("test_report_{ts}.html"). If multiple
// tests ran, a dropdown lets the user pick which one to replay.
function RunPlayback({ result, liveProgress, tests, onClose, onRerunFailed }) {
  // Build one entry per completed test. UI tests get a videoUrl (the .webm
  // recording, derived from the report URL timestamp). API tests get no
  // video — they show their captured log instead.
  const completedItems = (liveProgress?.items || [])
    .filter(it => (it.report_urls || []).length > 0 || ['passed','failed','cancelled'].includes(it.status));

  const entries = completedItems.map(it => {
    const reportUrl = (it.report_urls || [])[0] || '';
    const m = reportUrl.match(/test_report_(?:api_)?([0-9_]+)\.html/);
    const ts = m ? m[1] : null;
    const type = it.type || (it.filename?.includes('_api') ? 'api' : 'ui');
    const videoUrl = (type === 'ui' && ts)
      ? `/screenshots/Test_UI_${ts}/recording_${ts}.webm`
      : '';
    const lookup = tests.find(t => t.id === it.id || t.filename === it.filename);
    return {
      id: it.id,
      filename: it.filename,
      type,
      friendlyName: lookup?.display_name || it.display_name || it.filename,
      status: it.status,
      reportUrl,
      videoUrl,
      log: it.liveLog || it.output || '',
    };
  });

  const [activeIdx, setActiveIdx] = useState(0);
  const [videoReady, setVideoReady] = useState(false);
  const [attempt, setAttempt] = useState(0);
  const videoRef = useRef(null);

  const active = entries[activeIdx] || entries[0] || null;
  const videoUrl = active?.videoUrl || '';

  // Poll-load the video for UI runs only — API tests have no recording,
  // they get the captured log directly. ffmpeg compression on UI runs
  // can take a beat after the SSE `done` event, so retry briefly.
  useEffect(() => {
    if (!videoUrl) { setVideoReady(true); return; }   // nothing to load — don't spin
    setVideoReady(false);
    setAttempt(0);
    let cancelled = false;
    let timer = null;

    const tryLoad = (n) => {
      if (cancelled) return;
      if (!videoRef.current) {
        timer = setTimeout(() => tryLoad(n), 400);
        return;
      }
      const v = videoRef.current;
      v.onloadeddata = () => { if (!cancelled) setVideoReady(true); };
      v.onerror = () => {
        if (cancelled) return;
        if (n < 12) {
          setAttempt(n + 1);
          timer = setTimeout(() => tryLoad(n + 1), 1500);
        }
      };
      v.src = `${videoUrl}?t=${Date.now()}`;
    };
    tryLoad(0);
    return () => { cancelled = true; if (timer) clearTimeout(timer); };
  }, [videoUrl]);

  if (!active) {
    return (
      <>
        <div className="screencast-bar">
          <div className="bar-left">
            <span><span className="live-dot done" /> Run complete</span>
          </div>
          <button className="bar-close-btn" onClick={onClose}>Close</button>
        </div>
        <div className="screencast-frame">
          <div className="screencast-placeholder">
            <div>No video available — the run produced no report.</div>
          </div>
        </div>
      </>
    );
  }

  const statusLabel = active.status === 'passed' ? 'PASSED'
                    : active.status === 'failed' ? 'FAILED'
                    : (active.status || 'DONE').toUpperCase();
  const statusColor = active.status === 'passed' ? '#16A34A'
                    : active.status === 'failed' ? '#DC2626'
                    : '#FE763C';

  // API tests have no video — render the captured pytest log instead.
  const isApi = active.type === 'api';

  return (
    <>
      <div className="screencast-bar">
        <div className="bar-left">
          <span style={{whiteSpace:'nowrap'}}>
            <span className="live-dot done" /> Replay
            <span style={{color:statusColor, fontWeight:700, marginLeft:8}}>{statusLabel}</span>
          </span>
          {entries.length > 1 ? (
            <select
              value={activeIdx}
              onChange={(e) => setActiveIdx(Number(e.target.value))}
              style={{background:'#0f0f12',color:'#fff',border:'1px solid #3a3a3e',
                      borderRadius:6,padding:'4px 8px',fontSize:'0.78rem',
                      fontFamily:'Inter,sans-serif',maxWidth:'60%'}}>
              {entries.map((e, i) => (
                <option key={i} value={i}>
                  [{(e.type || 'ui').toUpperCase()}] {e.friendlyName}
                </option>
              ))}
            </select>
          ) : (
            <span className="test-name-chip">
              {active.friendlyName}
              <span className={`type-badge ${active.type || 'ui'}`} style={{marginLeft:8,verticalAlign:'middle'}}>
                {(active.type || 'ui').toUpperCase()}
              </span>
            </span>
          )}
        </div>
        <button className="bar-close-btn" onClick={onClose}>Close</button>
      </div>
      {isApi ? (
        <div className="terminal-pane">
          <div className="terminal-window">
            <div className="terminal-titlebar">
              <span className="dot r" /><span className="dot y" /><span className="dot g" />
              <span className="label">pytest log · {active.filename}</span>
            </div>
            <div className="terminal-body">
              {active.log
                ? renderTerminalLines(active.log)
                : <span className="ln-dim">No log captured for this test.</span>}
            </div>
          </div>
        </div>
      ) : (
        <div className="screencast-frame">
          {!videoReady && (
            <div className="screencast-placeholder">
              <div className="spinner-inline" />
              <div>Preparing video…</div>
              <div style={{fontSize:'0.72rem',marginTop:'0.5rem',opacity:0.7}}>
                {attempt > 0
                  ? `Compressing (retry ${attempt}/12)…`
                  : 'Finalizing the recording. This usually takes a few seconds.'}
              </div>
            </div>
          )}
          {/* Loaded but paused — user clicks play when they're ready. */}
          <video
            ref={videoRef}
            controls
            preload="auto"
            style={videoReady ? {} : {display:'none'}}
          />
        </div>
      )}
      <div className="playback-actions">
        {active.reportUrl && (
          <a href={active.reportUrl} target="_blank" rel="noopener noreferrer">
            View Full Report ↗
          </a>
        )}
        {videoUrl && (
          <a href={videoUrl} download className="secondary">
            Download Video
          </a>
        )}
        {/* Re-run failed: only surfaces when the parent run actually has
            failures. Manual-only (per project policy: no auto-retry). */}
        {onRerunFailed && entries.some(e => e.status === 'failed') && (
          <button onClick={onRerunFailed} title="Re-run only the failing tests from this run">
            Re-run Failed
          </button>
        )}
      </div>
    </>
  );
}


// ─── Test Detail Modal ───
// Shows the objective + one-liner steps. The dashboard parses the
// test's .py file via AST to pull metadata directly:
//   - display_name : first line of the Test class docstring
//   - tags         : ``TAGS = [...]`` class attribute
//   - objective    : ``OBJECTIVE = "..."`` class attribute
//   - steps        : every ``start_step(N, "label")`` / ``sf.step(N, ...)``
//                    call, in number order
// No more sibling YAML files — one source of truth.
function TestDetailModal({ test, onClose }) {
  // Close on Esc
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [onClose]);

  const objective = test.objective || test.description || '';
  const steps = test.steps || [];
  const hasMetadata = !!(test.objective || (test.steps && test.steps.length));

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <div style={{flex:1, minWidth:0}}>
            <h3>{test.display_name || test.filename}</h3>
            {test.display_name && (
              <div className="modal-sub">{test.filename}</div>
            )}
          </div>
          <button className="modal-close" onClick={onClose} title="Close (Esc)">&times;</button>
        </div>
        <div className="modal-body">
          {!hasMetadata && (
            <div className="no-yaml">
              No metadata exposed by this test. Add{' '}
              <code>TAGS = [...]</code> and{' '}
              <code>OBJECTIVE = "..."</code> class attributes (plus a
              one-line class docstring as the name) to the test file
              and the dashboard will pick them up automatically — no
              restart needed.
            </div>
          )}
          {objective && (
            <>
              <h4>Objective</h4>
              <div className="objective">{objective}</div>
            </>
          )}
          {steps.length > 0 && (
            <>
              <h4>Steps ({steps.length})</h4>
              <ol className="steps-list">
                {steps.map((s, i) => <li key={i}>{s}</li>)}
              </ol>
            </>
          )}
          {test.tags && test.tags.length > 0 && (
            <div className="tags">
              {test.tags.map((tag, i) => <span key={i} className="tag">{tag}</span>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ─── Live Progress Component ───
function LiveProgress({ progress, running, onCancelAll, onCancelCurrent, tests, currentResult }) {
  // (Per-item "Show Log" button removed — the live log is always
  // available in the right pane, both during the run and on replay.
  // Avoids duplicating output in two places.)

  const allDone = progress.items.every(it => ['passed','failed','cancelled'].includes(it.status));
  const anyFailed = progress.items.some(it => it.status === 'failed');
  const anyCancelled = progress.items.some(it => it.status === 'cancelled');
  const cardClass = `card progress-card${allDone ? (anyFailed ? ' done-fail' : anyCancelled ? ' done-fail' : ' done-pass') : ''}`;

  // Map id → display_name from the tests list so the panel shows the
  // friendly title (and the type badge) rather than the bare filename.
  const friendlyName = (item) => {
    const t = (tests || []).find(t => t.id === item.id || t.filename === item.filename);
    return t?.display_name || item.display_name || item.filename;
  };

  return (
    <div className={cardClass} style={{marginBottom:'1rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.5rem',gap:8,flexWrap:'wrap'}}>
        <h2 style={{margin:0}}>{running ? 'Running Tests...' : 'Run Complete'}</h2>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {/* View Full Report — visible once the run finishes and the
              combined HTML exists. One-click jump to the gutter+iframe
              view without going to the Run History tab. */}
          {!running && currentResult?.combined_report_url && (
            <>
              <a
                href={currentResult.combined_report_url}
                target="_blank"
                rel="noopener noreferrer"
                className="btn btn-primary btn-sm"
                style={{textDecoration:'none', fontSize:'0.75rem'}}
                title="Open the combined run report (every test in one HTML)"
              >
                View Full Report ↗
              </a>
              <a
                href={currentResult.combined_report_url}
                download={`run_${currentResult.run_id}.html`}
                className="btn btn-ghost btn-sm"
                style={{textDecoration:'none', fontSize:'0.75rem'}}
                title="Download the self-contained offline copy"
              >
                &#x2B07;
              </a>
            </>
          )}
          {running && onCancelAll && (
            <button className="btn btn-danger btn-sm" onClick={onCancelAll}>
              Cancel All
            </button>
          )}
        </div>
      </div>
      {progress.items.map((item, i) => {
        let idxClass = 'idx-waiting';
        if (item.status === 'running') idxClass = 'idx-running';
        else if (item.status === 'passed') idxClass = 'idx-passed';
        else if (item.status === 'failed' || item.status === 'cancelled') idxClass = 'idx-failed';

        return (
          <div key={i}>
            <div className="progress-item">
              <div className={`idx ${idxClass}`}>
                {item.status === 'running'
                  ? <span className="spinner-inline" style={{width:14,height:14,borderWidth:2}} />
                  : item.index}
              </div>
              <div style={{flex:1, minWidth:0}}>
                <div className="name" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span>{friendlyName(item)}</span>
                  {item.type && <span className={`type-badge ${item.type}`}>{item.type.toUpperCase()}</span>}
                </div>
                {item.status === 'running' && <span style={{fontSize:'0.75rem',color:'var(--orange)'}}>Currently executing...</span>}
                {item.status === 'waiting' && <span style={{fontSize:'0.75rem',color:'var(--muted)'}}>Waiting</span>}
                {item.status === 'cancelled' && <span style={{fontSize:'0.75rem',color:'var(--danger)'}}>Cancelled by user</span>}
                {(item.status === 'passed' || item.status === 'failed') && item.verdicts && (
                  <span style={{fontSize:'0.75rem',color:'var(--muted)'}}>
                    {item.verdicts.length} test{item.verdicts.length !== 1 ? 's' : ''} - {item.verdicts.filter(v=>v.result==='passed').length} passed, {item.verdicts.filter(v=>v.result!=='passed').length} failed
                  </span>
                )}
                {item.report_urls && item.report_urls.length > 0 && (() => {
                  // Dedupe — parallel runs can rarely surface the same
                  // URL twice through different attribution paths.
                  // Only one link is shown; in the unusual case where
                  // a test emits multiple distinct reports (e.g. a
                  // retry helper), surface the count instead of
                  // repeating the link.
                  const unique = [...new Set(item.report_urls)];
                  const primary = unique[0];
                  return (
                    <span style={{marginLeft:8}}>
                      <a href={primary} target="_blank" rel="noopener noreferrer"
                         style={{fontSize:'0.75rem',color:'var(--orange)',fontWeight:600,textDecoration:'none'}}
                         onClick={(e) => e.stopPropagation()}>
                        View Report{unique.length > 1 ? ` (+${unique.length - 1} more)` : ''}
                      </a>
                    </span>
                  );
                })()}
              </div>
              <div className="meta" style={{display:'flex',alignItems:'center',gap:8}}>
                {item.status === 'running' && running && onCancelCurrent && (
                  <button className="btn btn-danger btn-sm" style={{padding:'0.2rem 0.5rem',fontSize:'0.7rem'}} onClick={onCancelCurrent}>
                    Cancel
                  </button>
                )}
                {item.status === 'passed' && <span className="badge badge-passed">Passed</span>}
                {item.status === 'failed' && <span className="badge badge-failed">Failed</span>}
                {item.status === 'cancelled' && <span className="badge badge-error">Cancelled</span>}
                {item.status === 'running' && <span className="badge badge-running">Running</span>}
                {item.status === 'waiting' && <span className="badge badge-waiting">Queued</span>}
                {item.duration_s != null && <span style={{fontSize:'0.75rem',color:'var(--muted)'}}>{fmtDuration(item.duration_s)}</span>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}


// (RunResult and ReportBrowser components removed — the History row now

// there's no inline summary panel any more.)

ReactDOM.render(<App />, document.getElementById('root'));
